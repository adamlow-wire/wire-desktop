name: Lint

on:
  push:
    branches: [main, staging, dev, integration/electron-modernization]
  pull_request:
    branches:
      [
        main,
        staging,
        dev,
        integration/electron-modernization,
        cap/CAP-001-production-accounts-2026-09-09,
        cap/CAP-005-managed-backends-2026-09-10,
        sec/SEC-010-local-protocol-2026-09-10,
      ]
  merge_group:
    branches: [main, staging, dev]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'yarn'

      - name: Install JS dependencies
        run: yarn --immutable

      - name: Lint
        run: yarn lint
