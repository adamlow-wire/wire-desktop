name: Build and Test

on:
  push:
    branches: [main, staging, dev, integration/electron-modernization]
  pull_request:
    branches: [main, staging, dev, integration/electron-modernization]
  merge_group:
    branches: [main, staging, dev]

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn --immutable
      - name: Use xvfb-run on Linux
        run: sed -i 's/\(electron-mocha \)/xvfb-run \1/g' package.json
      - name: Test
        run: yarn test
      - name: Collect coverage and enforce changed-code thresholds
        run: yarn coverage
        env:
          DIFF_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ runner.os }}
          path: coverage
          retention-days: 14
