name: Build and Test

on:
  push:
    branches: [main, staging, dev, integration/electron-modernization]
  pull_request:
    branches:
      [
        main,
        staging,
        dev,
        integration/electron-modernization,
        cap/CAP-001-production-accounts-2026-09-09,
        cap/CAP-005-managed-backends-2026-09-10,
        sec/SEC-010-local-protocol-2026-09-10,
        cap/CAP-006-second-instance-2026-09-10,
      ]
  merge_group:
    branches: [main, staging, dev]

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn --immutable
      - name: Prepare Electron sandbox helper for Linux tests
        run: |
          node node_modules/electron/install.js
          helper=node_modules/electron/dist/chrome-sandbox
          test -f "$helper"
          test ! -L "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - name: Use xvfb-run on Linux
        run: sed -i 's/\(electron-mocha \)/xvfb-run \1/g' package.json
      - name: Test types
        timeout-minutes: 10
        run: yarn test:types
      - name: Build test application
        timeout-minutes: 10
        run: yarn prestart
      - name: Build test TypeScript
        timeout-minutes: 10
        run: yarn build:ts:tests
      - name: Test React renderer
        timeout-minutes: 10
        run: yarn test:react
      - name: Test Electron main process
        timeout-minutes: 10
        run: yarn test:main
      - name: Test maintained ESM source
        timeout-minutes: 10
        run: yarn test:runtime:node
      - name: Test media
        timeout-minutes: 10
        run: yarn test:media
      - name: Test renderer
        timeout-minutes: 10
        run: yarn test:renderer
      - name: Test build tools
        timeout-minutes: 10
        run: yarn test:bin
      - name: Collect coverage and enforce changed-code thresholds
        timeout-minutes: 15
        run: yarn coverage
        env:
          DIFF_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ runner.os }}
          path: coverage
          retention-days: 14
