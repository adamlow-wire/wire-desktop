<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wire permissions</title>
    <link rel="stylesheet" href="../css/account-permission.css" />
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">w</span>
        <span id="brand-name">Wire</span>
      </div>
      <h1 id="permission-title">Permission request</h1>
      <div id="permission-scopes" class="scope-list"></div>
      <p class="origin-line">
        <span id="origin-label"></span>
        <strong id="requesting-origin"></strong>
      </p>
      <footer>
        <button id="permission-cancel" type="button" autofocus>Not now</button>
        <button id="permission-allow" type="button">Allow</button>
      </footer>
    </main>
  </body>
</html>
